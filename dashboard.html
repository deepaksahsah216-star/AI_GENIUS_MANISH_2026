    <style>
        body { margin: 0; background: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .dashboard-container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #58a6ff; text-align: center; }

        .switch-off { background: #da3633; color: white; box-shadow: 0 0 15px #da3633; }
        .live-status-box { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; text-align: center; margin-bottom: 25px; }
        .live-count { font-size: 36px; color: #39d353; font-weight: bold; }
        .founder-actions { display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 30px; }
        .btn-action { padding: 15px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 10px; }
        .btn-danger { background: #da3633; color: white; }

    <div class="dashboard-container">
        <h1>AI GENIUS MANISH 2026 - मुक्ति स्थल</h1>

        <!-- ग्लोबल महा-मास्टर स्विच -->
        <div class="master-switch-box">
            <h2>🌍 ग्लोबल महा-मास्टर स्विच (All Users Control)</h2>
            <p id="switchStatusText" style="font-size: 18px; margin-bottom: 15px; color: #39d353;">स्थिति: सिस्टम अभी ON है (सभी यूजर्स इस्तेमाल कर सकते हैं)</p>
            <button id="globalMasterSwitch" class="switch-btn switch-on" onclick="toggleGlobalSystem()">सिस्टम अभी ON है</button>
        </div>

        <!-- लाइव एक्टिव यूजर्स -->
        <div class="live-status-box">
            <h3>🔴 लाइव एक्टिव यूजर्स</h3>
            <div class="live-count" id="activeUsersCount">1,042</div>
            <p>लोग अभी इस ऐप का इस्तेमाल कर रहे हैं</p>
        </div>

        <!-- अन्य फाउंडर कंट्रोल -->
        <h2>🛠️ अन्य फाउंडर कंट्रोल</h2>
        <div class="founder-actions">
            <button class="btn-action btn-danger" onclick="masterAction('delete')">वेब को परमानेंट पूरी तरह हटाएं</button>
            <button class="btn-action btn-warning" onclick="masterAction('stop')">इसे अभी तुरंत फ्रीज करें</button>
            <button class="btn-action btn-info" onclick="masterAction('pause')">थोड़ी देर बाद चालू करें</button>
        </div>
    </div>

    <script>
        let isSystemOn = true;

        function toggleGlobalSystem() {
            const mainBtn = document.getElementById('globalMasterSwitch');
            const statusText = document.getElementById('switchStatusText');
            
            if (isSystemOn) {
                isSystemOn = false;
                mainBtn.className = "switch-btn switch-off";
                mainBtn.innerText = "सिस्टम अभी OFF है";
                statusText.innerText = "स्थिति: सिस्टम बंद है (सभी यूजर्स का एक्सेस ब्लॉक कर दिया गया है)";
                statusText.style.color = "#da3633";
                alert("मनीष सर, आपने सिस्टम को OFF कर दिया है। अब कोई भी यूजर इस वेब को नहीं चला पाएगा।");
            } else {
                isSystemOn = true;
                mainBtn.className = "switch-btn switch-on";
                mainBtn.innerText = "सिस्टम अभी ON है";
                statusText.innerText = "स्थिति: सिस्टम अभी ON है (सभी यूजर्स इस्तेमाल कर सकते हैं)";
                statusText.style.color = "#39d353";
                alert("मनीष सर, सिस्टम को वापस ON कर दिया गया है। सभी यूजर्स के फोन में ऐप अपने आप चालू हो गई है।");
            }
        }

        function masterAction(type) {
            if (type === 'delete') {
                let confirm1 = confirm("क्या आप वाकई इस पूरी वेब ऐप और इसके सभी डेटाबेस को हमेशा के लिए डिलीट करना चाहते हैं?");
                if (confirm1) alert("वेब को पूरी तरह से हटा दिया गया है।");
            } else if (type === 'stop') {
                alert("सर्विस को तुरंत रोक दिया गया है।");
            } else if (type === 'pause') {
                alert("सिस्टम को अस्थायी रूप से पॉज कर दिया गया है।");
  // मनीष गुप्ता जी का फ़ायरबेस रियल-टाइम डेटाबेस कनेक्शन
  const firebaseConfig = {
    apiKey: "AIzaSyAccs4zEqYW-c5KCGoHq1KFsC",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "aigeniusmanish2026",
    storageBucket: "://appspot.com",
    messagingSenderId: "723028754117",
    appId: "1:723028754117:web:1c09cf21fffc5a6bd430b0",
    measurementId: "G-4NTP35VCDY"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const database = firebase.database();
  console.log("AI_GENIUS_MANISH_2026: Database Connected.");
            }
        }
    </script>
</body>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, push, onChildAdded, update } from "https://gstatic.com";

  // मनीष जी का सही फ़ायरबेस कॉन्फ़िगरेशन
  const firebaseConfig = {
    apiKey: "AIzaSyAccs4zEqYW-c5KCGoHq1KFsCakC9b8Xes",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "aigeniusmanish2026",
    storageBucket: "aigeniusmanish2026.firebasestorage.app",
    messagingSenderId: "723028754117",
    appId: "1:723028754117:web:1c09cf21fffc54f96d7aac"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  console.log("Dashboard AI System Connected.");

  // एआई (Gemini AI) से खुद सोचकर जवाब बनवाने का मुख्य फ़ंक्शन
  async function askGeminiAI(userMessage) {
      // नोट: यहाँ अपनी असली Google Gemini API Key डालें
      const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
      const url = `https://googleapis.com{GEMINI_API_KEY}`;

      try {
          const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                  contents: [{
                      parts: [{
                          text: `तुम मनीष गुप्ता जी (IT Student) के पर्सनल एआई असिस्टेंट हो। कोई यूजर मनीष जी को व्हाट्सएप पर मैसेज भेज रहा है। इस मैसेज को समझकर बहुत ही बुद्धिमान, छोटा और मददगार जवाब हिंदी में लिखो। यूजर का मैसेज है: "${userMessage}"`
                      }]
                  }]
              })
          });

          const data = await response.json();
          // एआई का असली जवाब निकालना
          return data.candidates[0].content.parts[0].text;
      } catch (error) {
          console.error("एआई एरर आया:", error);
          return "नमस्ते! मनीष जी अभी थोड़े व्यस्त हैं। मैं उनका एआई असिस्टेंट हूँ, आपका मैसेज सुरक्षित नोट कर लिया गया है।";
      }
  }

  // फ़ायरबेस में आने वाले नए व्हाट्सएप मैसेज को लाइव सुनना
  const messagesRef = ref(database, 'notifications/');
  onChildAdded(messagesRef, async (snapshot) => {
      const messageId = snapshot.key;
      const messageData = snapshot.val();

      // अगर मैसेज व्हाट्सएप (WhatsApp) ऐप से आया है और अभी तक उसका जवाब नहीं दिया गया है
      if (messageData.appName && messageData.appName.toLowerCase().includes("whatsapp") && !messageData.aiProcessed) {
          console.log("नया व्हाट्सएप मैसेज मिला:", messageData.message);

          // 1. एआई खुद सोचेगा और जवाब बनाएगा
          const aiReply = await askGeminiAI(messageData.message);
          console.log("एआई ने खुद यह जवाब तैयार किया:", aiReply);

          // 2. एआई के जवाब को डेटाबेस के 'whatsapp_replies' फोल्डर में सेंड करना
          const repliesRef = ref(database, 'whatsapp_replies/');
          await push(repliesRef, {
              to: messageData.title, // मैसेज भेजने वाले का नाम/नंबर
              message: aiReply,
              timestamp: new Date().toISOString()
          });

          // 3. मैसेज को मार्क कर देना ताकि एआई बार-बार उसी मैसेज का जवाब न दे
          const currentMessageRef = ref(database, `notifications/${messageId}`);
          await update(currentMessageRef, {
              aiProcessed: true
          });

          console.log("एआई का जवाब नोटिफिकेशन सेंडिंग के लिए तैयार है!");
      }
  });
</script>
