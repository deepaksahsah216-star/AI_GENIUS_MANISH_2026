<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन | AI GENIUS MANISH 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #161b22;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
            text-align: center;
            width: 85%;
            max-width: 360px;
            border: 1px solid #30363d;
        }
        h2 { color: #00ff88; margin-bottom: 25px; font-size: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #8b949e; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #00ff88; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00ff88, #0077ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>AI GENIUS 2026</h2>
    <div class="input-group">
        <label>आपका नाम (या Founder नाम):</label>
        <input type="text" id="username" placeholder="यहाँ नाम लिखें">
    </div>
    <div class="input-group">
        <label>पासवर्ड (या मास्टर पासवर्ड):</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button onclick="handleLogin()">सुरक्षित लॉगिन करें</button>
</div>

<script>
    function handleLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (user.toLowerCase() === "manish" && pass === "manish77") {
            alert("फाउंडर मनीष गुप्ता जी का स्वागत है!");
            // यह सीधे आपको 3D अवतार स्वागत वाले सुंदर पेज पर भेजेगा
            window.location.href = "founder.html";
        } else if (pass === "user2026") {
            alert("सामान्य यूजर लॉगिन सफल!");
            // यह सामान्य यूज़र को उनके ऑटो-रिस्पॉन्डर पैनल पर भेजेगा
            window.location.href = "user-dashboard.html";
        } else {
            alert("गलत नाम या पासवर्ड! कृपया दोबारा जांचें।");
        }
    }
</script>

</body>
</html>
