<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D स्वागत गेटवे | मनीष सर</title>
    <style>
        body { margin: 0; background: #0d1117; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .founder-container { text-align: center; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        /* 3D रोबोट का चमकीला घेरा */
        .robot-box { width: 320px; height: 320px; border-radius: 50%; overflow: hidden; border: 4px solid #00ff88; box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); background: #161b22; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
        
        .secret-box-two { display: none; margin-top: 20px; animation: fadeIn 1s ease-in-out; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 10; }
        input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; margin-top: 15px; text-align: center; width: 80%; max-width: 250px; }
        button { padding: 12px 25px; background: #238636; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #2ea043; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    
    <!-- 3D रोबोट चलाने के लिए आवश्यक मुख्य जावास्क्रिप्ट स्क्रिप्ट (एरर रहित) -->
    <script type="module" src="https://googleapis.com"></script>
</head>
<body>

    <div class="founder-container">
        <!-- यह घेरा अब लाइव एनिमेटेड 3D रोबोट दिखाएगा -->
        <div class="robot-box">
            <model-viewer 
                src="https://modelviewer.dev" 
                autoplay 
                animation-name="Wave" 
                camera-controls 
                touch-action="none" 
                style="width: 100%; height: 100%; background-color: transparent;">
            </model-viewer>
        </div>
        
        <h2 id="statusText">मनीष सर का स्वागत हो रहा है...</h2>

        <!-- दूसरा सीक्रेट पासवर्ड बॉक्स -->
        <div id="secondSecretSection" class="secret-box-two">
            <h3>सुरक्षा जांच (Level 2)</h3>
            <p>मनीष गुप्ता जी, मुख्य मुक्ति स्थल पर जाने के लिए दूसरा पासवर्ड डालें:</p>
            <input type="password" id="secondSecretInput" placeholder="दूसरा गुप्त पासवर्ड">
            <br>
            <button onclick="verifySecondSecret()">डैशबोर्ड पर जाएँ</button>
        </div>
    </div>

    <!-- फ़ायरबेस कनेक्शन -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase } from "https://gstatic.com";

        const firebaseConfig = {
          apiKey: "AIzaSyAccs4zEqYW-c5KCGoHq1KFsCakC9b8Xes",
          authDomain: "://firebaseapp.com",
          databaseURL: "https://firebaseio.com",
          projectId: "aigeniusmanish2026",
          storageBucket: "aigeniusmanish2026.firebasestorage.app",
          messagingSenderId: "723028754117",
          appId: "1:723028754117:web:1c09cf21fffc54f96d7aac"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        console.log("Firebase Connected in Gateway!");
    </script>

    <script>
        const statusText = document.getElementById('statusText');
        const secondSecretSection = document.getElementById('secondSecretSection');

        // रोबोट के बोलने का फंक्शन
        function robotSpeak(text) {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'hi-IN';
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
        }

        // पेज लोड होने पर वॉइस ट्रिगर
        window.onload = function() {
            setTimeout(() => {
                robotSpeak("फाउंडर मनीष गुप्ता जी, आपका स्वागत है।");
            }, 1000);

            // 5 सेकंड बाद पासवर्ड बॉक्स दिखेगा
            setTimeout(() => {
                statusText.innerText = "स्वागत प्रक्रिया पूरी हुई, मनीष गुप्ता जी!";
                secondSecretSection.style.display = 'block';
                robotSpeak("कृपया सुरक्षा जांच के लिए दूसरा गुप्त पासवर्ड दर्ज करें।");
            }, 5000);
        };

        // पासवर्ड वेरिफिकेशन लॉजिक
        window.verifySecondSecret = function() {
            const secretTwo = document.getElementById('secondSecretInput').value;
            if (secretTwo === "gupta2026") {
                alert("वेरीफाई हुआ! मुख्य मुक्ति स्थल पर भेजा जा रहा है...");
                window.location.href = "dashboard.html"; 
            } else {
                alert("गलत पासवर्ड! कृपया सही कोड डालें, मनीष गुप्ता जी।");
                robotSpeak("पासवर्ड गलत है, कृपया दोबारा प्रयास करें।");
            }
        }
    </script>
</body>
</html>
